# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: CheckoutAndBuild
description: "The product is a Visual Studio extension, which only Visual Studio on Windows can load. Its core targets netstandard2.0 and builds anywhere, which is what this does."

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download

setup:
  # Das Testprojekt bauen, nicht Core: es referenziert Core und zieht es dadurch mit.
  - run: dotnet build VisualStudio/CheckoutAndBuild.Core.Tests -c Release

tasks:
  - name: test
    run: dotnet test VisualStudio/CheckoutAndBuild.Core.Tests -c Release --no-build
